name: Build GX Device Tester APK

on:
  push:
    paths:
      - 'apps/device-tester/**'
      - '.github/workflows/device-tester-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/device-tester
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GX-Device-Tester-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/GX-Device-Tester.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GX-Device-Tester-APK
          path: apps/device-tester/out/*.apk
