plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.financesuperkey.dpc'
    compileSdk 34

    defaultConfig {
        applicationId "com.financesuperkey.dpc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // In-app ADB (wireless debugging) self-provisioning — the app pairs with the
    // device's own adbd over localhost and sets itself as Device Owner. Same
    // technique used by Shizuku / App Manager. All on Maven Central.
    implementation 'io.github.muntashirakon:libadb-android:3.0.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
