# Finance Super Key — nginx site config for admin.deencircle.online
#
# Serves:
#   https://admin.deencircle.online/financekey         → Admin web (Next.js, :3100)
#   https://admin.deencircle.online/financekey/api/... → Backend API (NestJS, :3000)
#
# Install:
#   sudo cp deploy/nginx-financekey.conf /etc/nginx/sites-available/financekey
#   sudo ln -sf /etc/nginx/sites-available/financekey /etc/nginx/sites-enabled/financekey
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.deencircle.online      # adds SSL automatically
#
# NOTE: If admin.deencircle.online already has a server block elsewhere, do NOT
# add a second one — instead copy just the two `location /financekey ...` blocks
# into your existing server block for this domain.

server {
    listen 80;
    listen [::]:80;
    server_name admin.deencircle.online;

    # Backend API — must come before the /financekey block (longest match wins).
    # The trailing slash strips "/financekey/api/" so /financekey/api/v1/health
    # reaches the backend as /v1/health.
    location /financekey/api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin web (Next.js with basePath=/financekey). No trailing slash on
    # proxy_pass so the /financekey prefix is forwarded intact.
    location /financekey {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
