[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icast"
version = "1.1.0"
description = "iCast — professional iPhone screen casting for Linux (wired USB + wireless AirPlay)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
icast = "icast.cli:main"

[tool.setuptools.packages.find]
include = ["icast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
